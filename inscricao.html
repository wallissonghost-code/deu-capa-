<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><meta name="description" content="Inscreva-se para participar da próxima edição da DEU CAPA."><title>Participar — DEU CAPA</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Italiana&display=swap" rel="stylesheet"><link rel="stylesheet" href="inscricao.css?v=1"></head><body><header><a href="index.html" class="brand"><strong>DEU CAPA</strong><small>REVISTA DIGITAL</small></a><a href="index.html">← VOLTAR</a></header><main><section class="intro"><small>PRÓXIMA EDIÇÃO</small><h1>Sua história<br><em>pode estar aqui.</em></h1><p>Preencha seus dados para receber contato da equipe DEU CAPA. A inscrição não gera cobrança nem confirma publicação automaticamente.</p></section><form id="leadForm"><div class="grid"><label>Nome completo<input id="leadName" required maxlength="120" autocomplete="name"></label><label>WhatsApp<input id="leadWhatsapp" required maxlength="40" inputmode="tel" autocomplete="tel"></label><label>Instagram<input id="leadInstagram" maxlength="120" placeholder="@seuinstagram"></label><label>Cidade<input id="leadCity" maxlength="120"></label><label>Categoria / profissão<input id="leadCategory" maxlength="120" placeholder="Ex.: Empreendedora, artista, atleta"></label></div><label>Conte um pouco sobre você<textarea id="leadStory" rows="6" maxlength="2500" placeholder="Sua história, projeto, momento ou motivo para participar"></textarea></label><label class="photos">Fotos para apresentação <span>opcional · até 3 imagens · 5 MB cada</span><input id="leadPhotos" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="photoNames">Nenhuma foto selecionada.</div></label><div class="checks"><label><input id="consentPrivacy" type="checkbox" required> Li e aceito a <a href="privacidade.html" target="_blank">Política de Privacidade</a>.</label><label><input id="consentImage" type="checkbox" required> Autorizo o envio e análise das imagens para avaliação da minha participação, conforme os <a href="termos.html" target="_blank">Termos de Participação</a>.</label></div><button id="submitLead" type="submit">ENVIAR MINHA INSCRIÇÃO →</button><p id="leadStatus"></p></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cloud-config.js?v=1"></script><script src="inscricao.js?v=1"></script></body></html>
